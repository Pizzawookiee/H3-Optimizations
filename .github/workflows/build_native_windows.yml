name: Build Windows native DLL test

on:
  workflow_dispatch:
  push:
    branches:
      - streaming
    paths:
      - ".github/workflows/build_native_windows.yml"
      - "native/CMakeLists.txt"
      - "native/src/h3_int8_attention_api.cu"
      - "native/src/sage_attention/sage_attn_launcher.cu"
      - "native/src/sage_attention/sage_attn_sparse_launcher.cu"
      - "native/src/sage_attention/quant_qk_int8.cu"
      - "native/src/sage_attention/quant_v_int8.cu"
      - "native/src/sage_attention/v_staging.cu"
      - "native/src/**/*.cuh"
      - "native/src/PROVENANCE"

permissions:
  contents: read

jobs:
  build-sm89:
    name: Build h3_int8_attention.dll (SM89)
    runs-on: windows-2022
    env:
      CUDA_VERSION: "13.0.0"
      CUDA_CACHE_DIR: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore installed CUDA toolkit
        id: cuda-toolkit-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CUDA_CACHE_DIR }}
          key: windows-2022-cuda-13.0.0-nvcc-nvvm-crt-cudart-v3

      - name: Validate cached CUDA toolkit
        id: cuda-cache-validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolkit = $env:CUDA_CACHE_DIR
          $requiredFiles = @(
            "bin/nvcc.exe"
            "include/cuda_runtime.h"
            "include/cuda_fp8.h"
            "include/cuda_fp4.h"
            "lib/x64/cudart_static.lib"
            "nvvm/bin/cicc.exe"
          )

          $valid = $true
          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $toolkit $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Warning "Cached CUDA toolkit is missing $relativePath"
              $valid = $false
            }
          }

          if ($valid) {
            & (Join-Path $toolkit "bin/nvcc.exe") --version
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Cached nvcc failed with exit code $LASTEXITCODE"
              $valid = $false
            }
          }

          "valid=$($valid.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install minimal CUDA toolkit
        if: steps.cuda-cache-validation.outputs.valid != 'true'
        id: install-cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.0.0"
          method: network
          sub-packages: '["nvcc", "nvvm", "crt", "cudart"]'
          use-github-cache: "true"
          use-local-cache: "true"
          log-file-suffix: windows-2022.txt

      - name: Activate cached CUDA toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolkit = (Resolve-Path $env:CUDA_CACHE_DIR).Path
          "CUDA_PATH=$toolkit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_HOME=$toolkit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CICC_PATH=$(Join-Path $toolkit 'nvvm/bin')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $toolkit "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolkit "bin/nvcc.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc validation failed with exit code $LASTEXITCODE" }

      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) { throw "Visual Studio C++ build tools were not found" }
          "VS_INSTALL=$($installation.Trim())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore incremental native build
        uses: actions/cache@v5
        with:
          path: native/build
          key: windows-2022-ninja-cuda-13.0.0-sm89-native-v2-${{ hashFiles('native/CMakeLists.txt', 'native/src/**/*.cu', 'native/src/**/*.cuh') }}
          restore-keys: |
            windows-2022-ninja-cuda-13.0.0-sm89-native-v2-
            windows-2022-ninja-cuda-13.0.0-sm89-native-v1-

      - name: Prepare incremental native build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = "native/build/.native-source-hashes.json"
          $previousHashes = @{}
          if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
            $savedHashes = Get-Content -LiteralPath $manifestPath -Raw |
              ConvertFrom-Json -AsHashtable
            if ($savedHashes) { $previousHashes = $savedHashes }
          }

          $currentHashes = @{}
          $unchangedTimestamp = [DateTime]::SpecifyKind(
            [DateTime]::Parse("2000-01-01T00:00:00"),
            [DateTimeKind]::Utc
          )
          $changedTimestamp = [DateTime]::UtcNow

          $inputs = @(git ls-files -- native/CMakeLists.txt native/src)
          foreach ($path in $inputs) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $currentHashes[$path] = $hash
            $timestamp = $changedTimestamp
            if ($previousHashes.ContainsKey($path) -and $previousHashes[$path] -eq $hash) {
              $timestamp = $unchangedTimestamp
            }
            [System.IO.File]::SetLastWriteTimeUtc((Resolve-Path $path).Path, $timestamp)
          }

          New-Item -ItemType Directory -Path (Split-Path $manifestPath) -Force | Out-Null
          $currentHashes | ConvertTo-Json |
            Set-Content -LiteralPath $manifestPath -Encoding utf8

      - name: Configure CMake
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S native -B native/build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DH3_CUDA_ARCHS=89 ^
            "-DCMAKE_CUDA_COMPILER=%CUDA_PATH%\bin\nvcc.exe"

      - name: Build release DLL
        shell: cmd
        run: |
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build native/build --parallel

      - name: Package DLL, checksum, and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $env:RUNNER_TEMP "h3-int8-attention-sm89"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $dll = Resolve-Path "native/build/h3_int8_attention.dll"
          Copy-Item -LiteralPath $dll -Destination $artifactDir

          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  h3_int8_attention.dll" |
            Set-Content -LiteralPath (Join-Path $artifactDir "SHA256.txt") -Encoding ascii

          $vendoredSource = (Get-Content -LiteralPath "native/src/PROVENANCE" -Raw).Trim()
          @(
            "repository=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "runner_image=windows-2022"
            "cuda=$env:CUDA_VERSION"
            "cuda_architectures=89"
            "configuration=Release"
            "generator=Ninja"
            "vendored_source=$vendoredSource"
            "dll_sha256=$hash"
          ) | Set-Content -LiteralPath (Join-Path $artifactDir "BUILD_PROVENANCE.txt") -Encoding utf8

          "ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: h3-int8-attention-windows-sm89-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 0

